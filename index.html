    <script>
      // Defensive safeguard against scripts trying to mutate window.fetch
      try {
        if (typeof window !== 'undefined') {
          const originalFetch = window.fetch ? window.fetch.bind(window) : (typeof fetch !== 'undefined' ? fetch : undefined);
          try {
            window.fetch = originalFetch;
          } catch (_) {
            // Read-only getter environment: define property if configurable
            try {
              Object.defineProperty(window, 'fetch', {
                value: originalFetch,
                writable: true,
                configurable: true
              });
            } catch (__) {}
          }
        }
      } catch (e) {}
    </script>
